dependencies:
  espressif/esp_websocket_client: "~1.2"
  espressif/cjson: "~1.7"
  espressif/led_strip: "~3.0"
  # Keyed on GADGET_CODE_PAIRING, not _QR: a rule on a symbol whose
  # "depends on" is unmet fails the configure step under ESP-IDF 6.
  espressif/qrcode:
    version: "^0.1.0"
    rules:
      - if: "$CONFIG{GADGET_CODE_PAIRING} == True"
  idf:
    version: ">=5.1"
